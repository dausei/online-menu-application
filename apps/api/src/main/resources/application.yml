# All values can be overridden with environment variables (see .env.example in the repo root).
server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: online-menu-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/online_menu}
    username: ${DB_USERNAME:menu}
    password: ${DB_PASSWORD:menu}

  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway migrations (src/main/resources/db/migration)
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:5MB}
      max-request-size: ${UPLOAD_MAX_FILE_SIZE:5MB}

app:
  storage:
    local-root: ${STORAGE_LOCAL_ROOT:./data/media}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
